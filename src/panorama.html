<title>Gordons Knob Panorama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed panorama; glass instruments pinned to the corners like a surveyor's overlay. */
:root{
  color-scheme: dark;
  --ink: #0d1716;            /* beech-forest shadow */
  --glass: rgba(14, 26, 27, .62);
  --glass-hi: rgba(24, 40, 41, .78);
  --line: rgba(214, 228, 222, .18);
  --text: #eef3ef;
  --muted: #a9bab4;
  --marker: #ff7a1a;         /* DOC track-marker orange */
  --marker-deep: #c4520a;
  --hidden: #9fb1ab;
  --photo: #2fd6c6;          /* photo markers: teal, apart from the orange landmarks */
  --map-ring: #f4f1e8;
  --f-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
html,body{height:100%;}
[hidden]{display:none!important;}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--f-body);overflow:hidden;
  -webkit-font-smoothing:antialiased;touch-action:none;}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;overflow:hidden;background:var(--ink);}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;}
#gl.dragging{cursor:grabbing;}

/* --- Head block --- */
.head{position:absolute;z-index:5;pointer-events:none;
  top:calc(16px + env(safe-area-inset-top,0px));left:calc(18px + env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:4px;text-shadow:0 1px 18px rgba(0,0,0,.45);}
.eyebrow{font:500 11px/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
h1{margin:0;font-family:var(--f-display);font-stretch:62%;font-weight:800;font-size:clamp(34px,6vw,64px);
  line-height:.9;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance;}
.meta{font:400 12px/1.4 var(--f-mono);color:var(--text);opacity:.9;font-variant-numeric:tabular-nums;}
.chip{margin-top:8px;pointer-events:auto;align-self:flex-start;display:inline-flex;gap:8px;align-items:center;
  padding:6px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:500 11px/1.2 var(--f-mono);color:var(--muted);text-shadow:none;}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--marker);box-shadow:0 0 0 3px rgba(255,122,26,.25);}

/* --- Toolbar --- */
.tools{position:absolute;z-index:6;display:flex;gap:6px;
  top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));}
.tool{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--glass);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;cursor:pointer;
  transition:background .2s,border-color .2s;}
.tool:hover{background:var(--glass-hi);}
.tool[aria-pressed="true"]{border-color:rgba(255,122,26,.7);box-shadow:inset 0 0 0 1px rgba(255,122,26,.35);}
.tool svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.tool:focus-visible,.poi button:focus-visible,.map-wrap:focus-visible,.zoom button:focus-visible,#tape:focus-visible{outline:2px solid var(--marker);outline-offset:2px;}

/* --- POI pointers --- */
#pois{position:absolute;inset:0;pointer-events:none;z-index:3;}
#route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;}
.poi{position:absolute;left:0;top:0;will-change:transform;}
.poi .dot{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--marker);
  box-shadow:0 0 0 2px rgba(255,255,255,.9);transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1);}
.poi .dot::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--marker);opacity:0;}
.poi.in .dot::after{animation:ping 2.6s ease-out infinite;animation-delay:inherit;}
.poi .stem{position:absolute;left:-1px;bottom:0;width:2px;height:var(--h,60px);transform-origin:bottom;transform:scaleY(0);
  background:linear-gradient(to top,rgba(255,255,255,.95),rgba(255,255,255,.5));transition:transform .55s cubic-bezier(.2,.8,.2,1),height .35s ease;}
.poi button{position:absolute;left:0;bottom:var(--h,60px);transform:translate(-50%,-6px) scale(.85);opacity:0;pointer-events:auto;
  display:flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer;
  padding:6px 10px 6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--glass);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-align:left;
  transition:opacity .4s ease,transform .5s cubic-bezier(.2,.9,.25,1.2),bottom .35s ease,background .2s,border-color .2s;}
.poi button:hover,.poi.sel button{background:var(--glass-hi);border-color:rgba(255,122,26,.7);}
.poi .tri{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid var(--marker);flex:none;
  filter:drop-shadow(0 1px 0 var(--marker-deep));}
.poi .nm{font-family:var(--f-display);font-stretch:75%;font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;line-height:1;}
.poi .sub{display:block;margin-top:3px;font:400 10.5px/1 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.02em;}
.poi.in .dot{transform:scale(1);}
.poi.in .stem{transform:scaleY(1);}
.poi.in button{opacity:1;transform:translate(-50%,-6px) scale(1);transition-delay:calc(var(--d,0ms) + 260ms);}
.poi.in .stem{transition-delay:calc(var(--d,0ms) + 80ms);}
.poi.in .dot{transition-delay:var(--d,0ms);}
.poi.hid .dot{background:var(--hidden);}
.poi.hid .stem{background:repeating-linear-gradient(to top,rgba(255,255,255,.8) 0 4px,transparent 4px 8px);}
.poi.hid .tri{border-bottom-color:var(--hidden);filter:none;}
.poi.hid .nm{color:#d9e3df;}
.poi.off{visibility:hidden;}
#pois.labels-off .poi{display:none;}
.poi.photo .dot{background:var(--photo);box-shadow:0 0 0 2px rgba(255,255,255,.9);}
.poi.photo .dot::after{border-color:var(--photo);}
.poi.photo .cam{width:18px;height:18px;flex:none;stroke:var(--photo);fill:none;stroke-width:1.8;stroke-linejoin:round;}
.poi.photo button:hover,.poi.photo.sel button{border-color:rgba(47,214,198,.75);}
.lb{position:absolute;inset:0;z-index:30;display:grid;grid-template-rows:1fr auto;gap:12px;
  padding:calc(56px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:rgba(8,14,14,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;transition:opacity .35s ease;}
.lb.open{opacity:1;}
.lb img{width:100%;height:100%;min-height:0;object-fit:contain;border-radius:6px;transform:scale(.97);transition:transform .45s cubic-bezier(.2,.8,.2,1);}
.lb.open img{transform:scale(1);}
.lb figcaption{max-width:70ch;margin:0 auto;text-align:center;display:flex;flex-direction:column;gap:4px;}
.lb figcaption b{font-family:var(--f-display);font-stretch:70%;font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.02em;}
.lb figcaption span{font-size:13.5px;line-height:1.5;color:#d6e0dc;}
.lb .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));}
@keyframes ping{0%{transform:scale(.6);opacity:.9}70%{transform:scale(2.2);opacity:0}100%{opacity:0}}

/* --- Info card --- */
.card{position:absolute;z-index:6;width:min(320px,calc(100vw - 32px));
  left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding:14px 16px 14px;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:8px;
  transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .3s;}
.card .k{font:500 10.5px/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.card h2{margin:0;font-family:var(--f-display);font-stretch:70%;font-weight:800;font-size:28px;line-height:.95;text-transform:uppercase;letter-spacing:.01em;}
.card p{margin:0;font-size:13.5px;line-height:1.5;color:#d6e0dc;max-width:60ch;}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-top:2px;}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0;}
.stat b{font:500 15px/1.1 var(--f-mono);font-variant-numeric:tabular-nums;}
.stat span{font:400 10px/1.2 var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
.vis{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--f-mono);color:var(--muted);}
.vis i{width:8px;height:8px;border-radius:50%;background:var(--marker);}
.vis.no i{background:transparent;border:1.5px dashed var(--hidden);}
.hint{display:flex;flex-wrap:wrap;gap:6px 14px;font:400 11.5px/1.4 var(--f-mono);color:var(--muted);}
.hint kbd{font:inherit;color:var(--text);}

/* --- Compass tape --- */
.tape-wrap{position:absolute;z-index:4;left:50%;transform:translateX(-50%);
  bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100vw - 32px - 2 * 260px));min-width:0;}
#tape{display:block;width:100%;height:46px;border-radius:10px;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:ew-resize;}

/* --- Map --- */
.map-wrap{position:absolute;z-index:6;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:var(--ms,232px);height:var(--ms,232px);border-radius:50%;transition:width .45s cubic-bezier(.2,.8,.2,1),height .45s cubic-bezier(.2,.8,.2,1);}
.map-wrap.big{--ms:min(440px,calc(100vh - 140px),calc(100vw - 32px));}
#map{width:100%;height:100%;display:block;border-radius:50%;cursor:crosshair;
  box-shadow:0 0 0 3px rgba(244,241,232,.9),0 0 0 4px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.45);}
.zoom{position:absolute;left:-14px;bottom:8px;display:flex;flex-direction:column;gap:4px;}
.zoom button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--glass-hi);cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font:500 15px/1 var(--f-mono);display:grid;place-items:center;}
.map-label{position:absolute;left:50%;top:-24px;transform:translateX(-50%);white-space:nowrap;
  font:500 10.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-shadow:0 1px 8px rgba(0,0,0,.6);}

/* --- Loader --- */
.loader{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:var(--ink);transition:opacity .9s ease;}
.loader.done{opacity:0;pointer-events:none;}
.loader div{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:0 24px;}
.loader b{font-family:var(--f-display);font-stretch:62%;font-weight:800;font-size:44px;text-transform:uppercase;letter-spacing:.02em;}
.loader span{font:400 12px/1.5 var(--f-mono);color:var(--muted);}
.bar{width:180px;height:2px;background:var(--line);overflow:hidden;border-radius:2px;}
.bar::after{content:"";display:block;height:100%;width:40%;background:var(--marker);animation:slide 1.1s ease-in-out infinite;}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

@media (max-width: 860px){
  .tape-wrap{width:calc(100vw - 32px);bottom:calc(16px + env(safe-area-inset-bottom,0px));}
  .card{bottom:calc(74px + env(safe-area-inset-bottom,0px));}
  .map-wrap{--ms:150px;bottom:auto;top:calc(70px + env(safe-area-inset-top,0px));}
  .map-wrap.big{--ms:min(340px,calc(100vw - 32px));}
  .map-label{top:auto;bottom:-20px;}
  .zoom{left:-38px;bottom:auto;top:0;}
  .card.idle{display:none;}
}
@media (max-width: 520px){
  .head{max-width:52vw;}
  .meta .ll{display:none;}
  .tools{flex-direction:column;}
  .map-wrap{top:auto;bottom:calc(74px + env(safe-area-inset-bottom,0px));--ms:128px;}
  .card{right:auto;bottom:calc(214px + env(safe-area-inset-bottom,0px));}
  .zoom{left:-38px;top:auto;bottom:0;}
  .map-label{display:none;}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation:none!important;}
}
</style>

<div id="app">

  <header class="head">

<script>
/* =========================================================================
   CONFIG — edit here.
   PANORAMA.image: URL or data: URI of an equirectangular 360° image. It can be a horizontal
                   band: top/bottom give the elevations (degrees) of its first and last rows,
                   and the viewer continues the sky to the zenith and the ground to the nadir.
                   Leave image null to use the terrain placeholder.
   PANORAMA.centreBearing: true bearing (degrees) at the horizontal centre of the image.
   PANORAMA.horizonOffset: degrees to raise (+) or lower (−) the horizon if it isn't level.
   PANORAMA.lowestView: how far down (degrees) the bottom of the screen may look.
   ========================================================================= */
/* The stitched band is stored in two halves (u = 0 at the band's left edge, 1 at its right),
   each padded so neighbouring texels exist across the joins.
   CAL maps band coordinates onto true bearing and elevation, as Fourier series in the band
   bearing (degrees): true bearing = band + bearing(band); band elevation = true + elev(band).
   It was solved from 12 landmarks placed by eye in the calibration page plus the far skyline
   matched against the elevation model; landmarks land within ~0.3° (towns within ~2°). */
const CAL = { bearing: [-9.3225, -1.5425, -0.2896, -2.5352, -2.0409, 0.0568, -0.4781], elev: [-0.0977, 0.3481, -0.0139, -0.1919, -0.3502] };
const PANORAMA = {
  tiles: [ { src: "__PANO_A__", u0: -64 / 18032, u1: 0.5 + 64 / 18032 }, { src: "__PANO_B__", u0: 0.5 - 64 / 18032, u1: 1 + 64 / 18032 } ],
  patch: { src: "__CREW_PATCH__", b0: 176, b1: 193.5, e0: -9.5, e1: 1 },
  image: true, centreBearing: 180, horizonOffset: 0,
  top: 20, bottom: -27, zenith: [38, 92, 179], nadir: [104, 95, 75], lowestView: -25,
};

/* Camera position: beside the 1685 m trig on the Gordon Range, where the walk ended (the trig is
   georeferenced from the Topo50 spot heights; the calibration puts the camera ~17 m ESE of it and
   ~12 m lower). Gordons Knob itself (1592 m) is 880 m to the west-north-west. */
const VIEWPOINT = { name: "Point 1685", lat: -41.609916, lon: 172.945006, height: 1672.8, eye: 1.6 };

/* Photos taken on the day, pinned where they were taken looking. */
/* The walk up, traced from the Topo50 map and draped on the 14 m elevation model:
   [metres east, metres north, height] from the trig, plus whether each point is in view. */
const ROUTE = __ROUTE__;

const PHOTOS = [
  { name: "The summit crew", band: [184.57, -1.4], src: "__PHOTO_CREW__",
    caption: "On the knoll south of the summit, with the snow-capped St Arnaud and Travers ranges behind. This photo is blended into the panorama." },
  { name: "Toward Motueka", band: [28.6, -5], src: "__PHOTO_MOT__",
    caption: "Down the Wairoa side toward the Motueka valley, Tasman Bay and the coast." },
];

/* Positions are approximate (snapped to the highest nearby cell of a 200 m elevation grid). */
const POIS = [
  { name: "Gordons Knob", lat: -41.60411, lon: 172.93746, height: 1592, kind: "Peak",
    note: "The named knob at the west end of this summit ridge. The walk passes below it on the way up to the 1685 m trig." },
  { name: "Point 1614", lat: -41.60460, lon: 172.94066, height: 1614, kind: "Spot height", note: "Spot height on the ridge between the trig and Gordons Knob." },
  { name: "Point 1564", lat: -41.60106, lon: 172.96422, height: 1564, kind: "Spot height", note: "High point on the Gordon Range, east across the head of the valley." },
  { name: "Point 1519", lat: -41.59173, lon: 172.96935, height: 1519, kind: "Spot height", note: "Spot height on the Gordon Range, beside the marked route to the east." },
  { name: "Point 1371", lat: -41.57996, lon: 172.96631, height: 1371, kind: "Spot height", note: "Spot height on the spur north of the Gordon Range." },
  { name: "Point 1365", lat: -41.59856, lon: 172.95621, height: 1365, kind: "Spot height", note: "The knob at the bottom of the final climb, where the route turns up the ridge." },
  { name: "Point 1164", lat: -41.58121, lon: 172.94594, height: 1164, kind: "Spot height", note: "On the spur followed up from the road end at the start of the walk." },
  { name: "Red Hill",     lat: -41.6264, lon: 173.0558, height: 1790, kind: "Peak",
    note: "Highest point of the Richmond Range, on the ultramafic Red Hills mineral belt. The rust-coloured rock grows little more than tussock and scrub." },
  { name: "Mt Rintoul",   lat: -41.5186, lon: 173.2336, height: 1731, kind: "Peak",
    note: "A big scree-sided peak on the Richmond Alpine Track and Te Araroa, with Mt Rintoul Hut just below its summit." },
  { name: "Mt Richmond",  lat: -41.4736, lon: 173.3946, height: 1760, kind: "Peak",
    note: "The forest park's namesake, rising above the Pelorus and Wairau headwaters." },
  { name: "Mt Fishtail",  lat: -41.4449, lon: 173.4955, height: 1641, kind: "Peak",
    note: "Its split summit is easy to pick out at the north-east end of the Richmond Range." },
  { name: "Nelson",       lat: -41.2706, lon: 173.2840, height: null, kind: "City",
    note: "Whakatū, the region's main city, at the head of Tasman Bay." },
  { name: "Richmond",     lat: -41.3380, lon: 173.1830, height: null, kind: "Town",
    note: "Town on the Waimea Plains, just south-west of Nelson." },
  { name: "Tasman Bay",   lat: -41.1500, lon: 173.1000, height: null, kind: "Coast",
    note: "Te Tai-o-Aorere. On a clear day it shows as a silver band beyond the Waimea foothills." },
  { name: "Mt Arthur",    lat: -41.2185, lon: 172.6810, height: 1795, kind: "Peak",
    note: "Marble peak in Kahurangi National Park, standing above the Graham and Pearse valleys." },
  { name: "Mt Owen",      lat: -41.5509, lon: 172.5393, height: 1875, kind: "Peak",
    note: "Highest point in Kahurangi. Its glaciated marble plateau sits over one of the country's deepest cave systems." },
  { name: "Motueka",      lat: -41.1236, lon: 173.0122, height: null, kind: "Town",
    note: "Market town at the mouth of the Motueka River, on the western shore of Tasman Bay." },
  { name: "Lake Rotoiti", lat: -41.8300, lon: 172.8500, height: 610, kind: "Lake",
    note: "Glacial lake at St Arnaud in Nelson Lakes National Park, below the St Arnaud Range." },
];

<script>

      c.beginPath(); c.moveTo(prev.s[0], prev.s[1]); c.lineTo(s[0], s[1]); c.stroke();
    }
    prev = { p, s };
  }
  c.setLineDash([]);
  // start of the walk
  const s0 = reveal > 0 ? project(RP[0].b, RP[0].el) : null;
  if (s0 && s0[0] > 0 && s0[0] < W && s0[1] > 0 && s0[1] < H) {
    c.fillStyle = "#ff3d5a"; c.strokeStyle = "#fff"; c.lineWidth = 2;
    c.beginPath(); c.arc(s0[0], s0[1], 4.5, 0, TAU); c.fill(); c.stroke();
    c.font = "600 11px 'Archivo', sans-serif"; c.textBaseline = "middle"; c.lineWidth = 3; c.strokeStyle = "rgba(14,26,27,.8)";
    const t = "Road end · start of the walk"; c.strokeText(t, s0[0] + 9, s0[1]); c.fillStyle = "#fff"; c.fillText(t, s0[0] + 9, s0[1]);
  }
}

/* ---------------- Frame loop ---------------- */
const intro = { t0: 0, on: !reduceMotion };
function frame(now) {
  // camera motion
  if (view.target) {
    const t = Math.min(1, (now - view.target.t0) / view.target.dur), k = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    view.yaw = mix(view.target.y0, view.target.yaw, k); view.pitch = mix(view.target.p0, view.target.pitch, k);
    view.fov = mix(view.target.f0, view.target.fov, k);
    if (t >= 1) view.target = null;
  } else if (!dragging) {
    view.yaw += view.vy; view.pitch = clampPitch(view.pitch + view.vp);
    view.vy *= 0.92; view.vp *= 0.9;
    if (Math.abs(view.vy) < 0.002) view.vy = 0;
    const idle = now - idleAt;
    if (!reduceMotion && !CALIBRATE && (spin || idle > 14000) && !selected) view.yaw += 0.025 * Math.min(1, (idle - (spin ? 0 : 14000)) / 3000 + (spin ? 1 : 0));
  }
  if (gl && texReady) {
    gl.uniform2f(uni.res, canvas.width, canvas.height);
    gl.uniform1f(uni.yaw, view.yaw * D2R); gl.uniform1f(uni.pitch, view.pitch * D2R);
    gl.uniform1f(uni.tanHalf, tanHalf()); gl.uniform1f(uni.centre, PANORAMA_CENTRE * D2R);
    gl.uniform1f(uni.hOff, PANORAMA.horizonOffset * D2R);
    gl.uniform1f(uni.vTop, band.top * D2R); gl.uniform1f(uni.vBot, band.bottom * D2R);
    gl.uniform3fv(uni.zen, band.zenith); gl.uniform3fv(uni.nad, band.nadir);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  // POIs
  const hOff = PANORAMA.horizonOffset * D2R;
  let stagger = 0;
  view.pitch = clampPitch(view.pitch);
  const shown = [];
  for (const p of MARKERS) {
    const s = texReady ? (p.calib ? (([b, e]) => project(b, e * D2R))(bandToTrue(p.calib.b, p.calib.e)) : project(p.bearing, p.elev + hOff)) : null;
    const vis = s && s[0] > -60 && s[0] < W + 60 && s[1] > -40 && s[1] < H + 220;
    if (vis) {
      p.el.style.transform = `translate3d(${s[0].toFixed(1)}px,${s[1].toFixed(1)}px,0)`;
      p.el.classList.remove("off");
      if (!p.onScreen && now > intro.t0) {
        p.el.style.setProperty("--d", (now - p.lastSeen > 1500 ? stagger++ * 110 : 0) + "ms");
        p.el.classList.add("in");
      }
      p.onScreen = true; p.lastSeen = now; p.sx = s[0]; shown.push(p);
    } else if (p.onScreen) {
      p.onScreen = false; p.el.classList.remove("in"); p.el.classList.add("off");
    } else p.el.classList.add("off");
  }
  // stack labels so neighbours never overlap: lowest free tier, left to right
  shown.sort((a, b) => a.sx - b.sx);
  const tierRight = [];
  for (const p of shown) {
    if (!p.w) p.w = p.el.querySelector("button").offsetWidth || 150;
    let L = 0;
    while (L < 5 && tierRight[L] !== undefined && p.sx - p.w / 2 < tierRight[L] + 8) L++;
    L = Math.min(L, 4); tierRight[L] = p.sx + p.w / 2;
    if (p.tier !== L) { p.tier = L; p.el.style.setProperty("--h", (40 + L * 44) + "px"); }
  }
  drawRoute(now);
  drawTape(); drawMap();
  requestAnimationFrame(frame);
}

/* ---------------- Calibration hook (calibration build only) ---------------- */
const CALIBRATE = "__CALIBRATE__" === "1";
if (CALIBRATE) window.__pano = { view, project, POIS, PHOTOS, flyTo, select, D2R, R2D, bandToTrue, trueToBand, tanHalf, size: () => [W, H], canvas, poiLayer };

/* ---------------- Boot ---------------- */
function boot() {
  resize(); window.addEventListener("resize", resize);
  buildTopo(); idleCard();
  if (!gl) { $("loadMsg").textContent = "This view needs WebGL 2, which this browser hasn't enabled."; requestAnimationFrame(frame); return; }
  initGL();
  const finish = () => {
    $("loader").classList.add("done");
    intro.t0 = performance.now() + (reduceMotion ? 0 : 500);
    view.fov = clampFov(view.fov);
    if (intro.on) { view.yaw = 120; view.pitch = clampPitch(4); view.fov = clampFov(62); flyTo(PHOTOS[0].bearing, 0.5, 30); view.target.dur = 4600; }
    else { view.yaw = PHOTOS[0].bearing; view.fov = 30; view.pitch = 0.5; }
    idleAt = performance.now();
  };
  const usePlaceholder = () => {
    PANORAMA_CENTRE = 180; $("chip").hidden = false;
    setTimeout(() => { const r = renderPlaceholder(4096, 2048); upload(r, 0); upload(r, 1); useTiles([0, 1], [0, 1]); finish(); }, 30);
  };
  const load = (src) => new Promise((ok, fail) => { const im = new Image(); im.onload = () => ok(im); im.onerror = fail; im.src = src; });
  if (PANORAMA.tiles) {
    $("loadMsg").textContent = "Loading the full-resolution panorama…";
    Promise.all([...PANORAMA.tiles.map((t) => load(t.src)), PANORAMA.patch ? load(PANORAMA.patch.src) : null]).then(([a, b, p]) => {
      PANORAMA_CENTRE = PANORAMA.centreBearing; $("chip").hidden = true;
      Object.assign(band, { top: PANORAMA.top ?? 90, bottom: PANORAMA.bottom ?? -90,
        zenith: (PANORAMA.zenith || [0, 0, 0]).map((v) => v / 255), nadir: (PANORAMA.nadir || [0, 0, 0]).map((v) => v / 255),
        lowest: PANORAMA.lowestView ?? -90 });
      upload(a, 0); upload(b, 1);
      const [ta, tb] = PANORAMA.tiles; useTiles([ta.u0, ta.u1], [tb.u0, tb.u1]);
      gl.uniform1fv(uni.calB, new Float32Array(CAL.bearing)); gl.uniform1fv(uni.calE, new Float32Array(CAL.elev));
      if (p) { const r = PANORAMA.patch; upload(p, 2); gl.uniform4f(uni.patchR, r.b0 * D2R, r.b1 * D2R, r.e0 * D2R, r.e1 * D2R); gl.uniform1f(uni.hasPatch, 1); }
      finish();
    }).catch(() => { $("loadMsg").textContent = "Couldn't load the photos, so showing the terrain render."; usePlaceholder(); });
  } else usePlaceholder();
  requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot, boot); else boot();
})();
</script>
